name: build

on:
  push:
    branches: [ master, "modernize-*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: windows-latest
    # The ARM64 build needs the ARM64 MSVC component, which the hosted image
    # does not always carry. It is worth having when it is there and not worth
    # failing the run over when it is not.
    continue-on-error: ${{ matrix.platform == 'ARM64' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64, ARM64]

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild recaps.sln /t:Rebuild /p:Configuration=Release /p:Platform=${{ matrix.platform }} /v:minimal /nologo

      # Signing is off until a certificate is available. Without one SmartScreen
      # warns on every download, and a program that installs a global keyboard
      # hook is exactly what an antivirus looks at twice, so this is worth
      # turning on before publishing anything. Set the SIGN_RELEASES repository
      # variable to true and add the two secrets to enable it.
      - name: Sign
        if: vars.SIGN_RELEASES == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String("${{ secrets.SIGNING_CERTIFICATE }}"))
          & $signtool sign /f cert.pfx /p "${{ secrets.SIGNING_PASSWORD }}" /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            "bin\${{ matrix.platform }}\Release\recaps.exe"
          Remove-Item cert.pfx

      - uses: actions/upload-artifact@v4
        with:
          name: recaps-${{ matrix.platform }}
          path: bin/${{ matrix.platform }}/Release/recaps.exe
          if-no-files-found: error

  installer:
    name: installer
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # setup.iss picks the 32 or 64 bit binary by the architecture it installs
      # on, so it needs both of them in place
      - uses: actions/download-artifact@v4
        with:
          name: recaps-Win32
          path: bin/Win32/Release

      - uses: actions/download-artifact@v4
        with:
          name: recaps-x64
          path: bin/x64/Release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" setup.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: recaps-setup
          path: Output/*.exe
          if-no-files-found: error
